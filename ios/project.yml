# Generate AnimeDL.xcodeproj with:  brew install xcodegen && xcodegen
name: AnimeDL
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  AnimeDL:
    type: application
    platform: iOS
    sources: [AnimeDL]
    settings:
      base:
        # Must be unique to you; change it if Xcode says it's taken.
        PRODUCT_BUNDLE_IDENTIFIER: com.dwight123.animedl
        PRODUCT_NAME: AnimeDL
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: AnimeDL/Info.plist
      properties:
        CFBundleDisplayName: AnimeDL
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The Mac server speaks plain HTTP on your LAN / Tailscale address.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: AnimeDL connects to the download server running on your Mac.
        # Show saved episodes in the Files app (On My iPhone → AnimeDL).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
